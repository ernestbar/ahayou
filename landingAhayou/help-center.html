<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ahayou</title>

        <link
            rel="icon"
            href="imgs/logos/logo-ahayou-2.png"
            type="image/x-icon"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/header.css" />
        <link rel="stylesheet" href="css/header-options.css" />
        <link rel="stylesheet" href="css/containers.css" />
        <link rel="stylesheet" href="css/forms.css" />
        <link rel="stylesheet" href="css/footer.css" />
        <link rel="stylesheet" href="css/vanilla-page.css" />
        <link rel="stylesheet" href="css/buttons.css" />
        <link rel="stylesheet" href="css/hamburger.css" />
    </head>
    <body>
        <header class="header">
            <nav class="header__nav">
                <a href="/index.html" class="header__logo">
                    <img
                        class="header__logo-img"
                        src="imgs/logos/logo-ahayou.png"
                        alt="Logo Ahayou"
                    />
                </a>
                <div class="header__nav-buttons">
                    <button
                        class="header__button header__button--text header__button--bg-orange"
                    >
                        Suscr&iacute;bete
                    </button>
                    <button
                        class="header__button header__button--text header__button--bg-green"
                    >
                        Iniciar Sesi&oacute;n
                    </button>
                </div>
                <div class="header__nav-buttons">
                    <div>
                        <button
                            class="header__button header__button--icon"
                        ></button>
                        <button
                            class="header__button header__button--icon"
                        ></button>
                    </div>
                </div>
                <div class="options__container">
                    <button class="hamburger__button" id="menuButton">
                        <span
                            class="hamburger__line hamburger__line--white"
                        ></span>
                        <span
                            class="hamburger__line hamburger__line--white"
                        ></span>
                        <span
                            class="hamburger__line hamburger__line--white"
                        ></span>
                    </button>
                    <div class="options__menu" id="optionsMenu">
                        <button class="options__button">Espa&ntilde;ol</button>
                        <button class="options__button">Ingl&eacute;s</button>
                    </div>
                </div>
            </nav>
        </header>
        <main class="main main--flex">
            <div class="container__wrapper container__wrapper--black">
                <h1 class="form__title">Centro de ayuda</h1>
                <form class="form">
                    <label
                        for="question"
                        class="form__label form__label--first text--black"
                    >
                        ¿C&oacute;mo podemos ayudar?
                    </label>
                    <div
                        class="form__input-container form__input-container--row form__input-container--no-gap"
                    >
                        <input
                            type="text"
                            name="question"
                            placeholder="Escribe una pregunta, un tema o un problema"
                            id="question"
                            minlength="3"
                            maxlength="500"
                            autocomplete="off"
                            class="form__input form--shadow-left"
                        />
                        <button
                            type="submit"
                            class="button button--orange form--shadow-right"
                        >
                            <img src="imgs/etc/arrow.svg" alt="Enviar" />
                        </button>
                    </div>
                </form>
            </div>
        </main>
        <footer class="footer footer--black">
            <div class="footer__image-container">
                <img
                    src="imgs/logos/logo-ahayou-2.png"
                    alt="Logo Ahayou"
                    class="footer__image"
                />
            </div>
            <div class="footer__content">
                <div class="footer__list">
                    <div class="footer__list-item">
                        <a href="#frequent-questions">Preguntas frecuentes</a>
                        <a href="/pages/privacy.html">Privacidad</a>
                    </div>
                    <div class="footer__list-item">
                        <a href="/pages/help-center.html">Centro de Ayuda</a>
                        <a href="#">Avisos Legales</a>
                    </div>
                    <div class="footer__list-item">
                        <a href="#">T&eacute;rminos de uso</a>
                        <a href="/pages/contacts.html">Contacto</a>
                    </div>
                </div>
                <div class="footer__data footer__data--black">
                    <div class="footer__contacts">
                        <div>
                            <span>+(591) 75874441</span>
                        </div>
                        <div class="social-media">
                            <a href="#" class="social-media__link">
                                <img
                                    src="imgs/logos/social-media/black/facebook.svg"
                                    alt="Facebook"
                                    class="social-media__img"
                                />
                            </a>
                            <a href="#" class="social-media__link">
                                <img
                                    src="imgs/logos/social-media/black/x.svg"
                                    alt="X"
                                    class="social-media__img"
                                />
                            </a>
                            <a href="#" class="social-media__link">
                                <img
                                    src="imgs/logos/social-media/black/Instagram.svg"
                                    alt="Instagram"
                                    class="social-media__img"
                                />
                            </a>
                            <a href="#" class="social-media__link">
                                <img
                                    src="imgs/logos/social-media/black/linkedln.svg"
                                    alt="Linkedln"
                                    class="social-media__img"
                                />
                            </a>
                            <a href="#" class="social-media__link">
                                <img
                                    src="imgs/logos/social-media/black/whatsapp.svg"
                                    alt="Whatsapp"
                                    class="social-media__img"
                                />
                            </a>
                        </div>
                    </div>
                    <div class="footer__copyright">
                        <p>Copyright 2025 Bolivia</p>
                        <p>Ahayou</p>
                    </div>
                </div>
            </div>
        </footer>

        <script src="/js/footer-visited-color.js"></script>
        <script src="/js/open-menu.js"></script>
    </body>
</html>
